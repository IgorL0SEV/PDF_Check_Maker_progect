name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check WeasyPrint import
        run: python -c "import weasyprint; print('WeasyPrint', weasyprint.__version__)"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate PDF and verify engine
        run: |
          python pdf_generator.py --data data/invoices.csv --template templates/invoice.html --invoice INV-2026-001 --no-open 2>&1 | tee run.log
          grep -q "Движок: weasyprint" run.log
